<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMusicReco</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1c1b19; --muted: #6b6860; --line: #e4e1da;
    --accent: #d14b2f; --accent-soft: #fbe9e4; --new: #2f7d4f; --new-soft: #e3f2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --panel: #1f1e1c; --text: #ecebe7; --muted: #9b978d; --line: #33312d;
      --accent: #f0714f; --accent-soft: #3a231c; --new: #6fcf97; --new-soft: #1d3326;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 0; max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; max-width: 960px; margin: 16px auto 0; padding: 0 16px; }
  nav button { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
  nav button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 960px; margin: 16px auto 40px; padding: 0 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0; font-size: 18px; }
  .card .desc { color: var(--muted); margin: 2px 0 10px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .actions a, .actions button { font: inherit; font-size: 13px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
  li { counter-increment: n; display: grid; grid-template-columns: 2em 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); align-items: baseline; }
  li::before { content: counter(n); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  li a { color: inherit; text-decoration: none; }
  li a:hover { text-decoration: underline; }
  .artist { color: var(--muted); }
  .why { color: var(--muted); font-size: 12px; display: block; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--new-soft); color: var(--new); white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
  .loading { color: var(--muted); padding: 24px 0; }
  .error { color: var(--accent); }
  #spotify { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
  #spotify a, #spotify button { font: inherit; font-size: 13px; color: var(--new); background: var(--new-soft); border: 0; border-radius: 6px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
  .sync-result { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .sync-result a { color: var(--new); }
  details.card { padding: 0; }
  details.card summary { padding: 12px 16px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  details.card summary .when { color: var(--muted); font-size: 13px; }
  details.card summary .stats { grid-row: span 2; text-align: right; font-size: 13px; color: var(--muted); white-space: nowrap; }
  details.card summary .stats b { color: var(--text); font-size: 15px; }
  details.card ol { padding: 0 16px 12px; }
  .plays { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .plays.hit { color: var(--new); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>MyMusicReco</h1>
  <p id="subtitle">Playlists construites à partir de ton historique Last.fm.</p>
  <div id="spotify"></div>
</header>
<nav id="tabs">
  <button data-tab="weekly" class="active">Découvertes de la semaine</button>
  <button data-tab="daily">Daily Mixes</button>
  <button data-tab="moods">Humeur / activité</button>
  <button data-tab="history">Historique</button>
  <button data-tab="profile">Mon profil</button>
</nav>
<main id="content"></main>
<script>
const content = document.getElementById("content");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

async function api(path, method = "GET") {
  const res = await fetch(path, { method });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function playlistCard(p, refreshPath) {
  const newCount = p.tracks.filter(t => !t.known).length;
  const items = p.tracks.map(t => `
    <li>
      <span><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a> <span class="artist">· ${esc(t.artist)}</span>
        <span class="why">${esc(t.source)}</span></span>
      ${t.known ? "" : '<span class="badge">nouveau</span>'}
    </li>`).join("");
  return `<section class="card">
    <h2>${esc(p.name)}</h2>
    <p class="desc">${esc(p.description)} ${p.tracks.length} titres, dont ${newCount} nouveaux.</p>
    <div class="actions">
      <a href="/api/playlists/${p.id}/export?format=csv">Export CSV</a>
      <a href="/api/playlists/${p.id}/export?format=json">Export JSON</a>
      <button data-refresh="${esc(refreshPath)}">Régénérer</button>
      ${spotifyConnected ? `<button data-sync="${esc(p.id)}">Envoyer vers Spotify</button>` : ""}
    </div>
    <p class="sync-result" id="sync-${esc(p.id)}" hidden></p>
    <ol>${items}</ol>
  </section>`;
}

let spotifyConnected = false;

async function loadSpotify() {
  const box = document.getElementById("spotify");
  const s = await api("/api/spotify/status").catch(() => ({}));
  spotifyConnected = !!s.connected;
  if (!s.configured) box.innerHTML = "Spotify : ajoute SPOTIFY_CLIENT_ID et SPOTIFY_CLIENT_SECRET dans .env pour exporter.";
  else if (!s.connected) box.innerHTML = `Spotify : non connecté <a href="/spotify/login">Connecter Spotify</a>`;
  else box.innerHTML = `Spotify : connecté (${esc(s.user || "")}) <button data-sync="all">Tout envoyer vers Spotify</button> <span id="sync-all"></span>`;
}

async function sync(target) {
  const out = document.getElementById(`sync-${target}`);
  out.hidden = false;
  out.textContent = "Envoi vers Spotify…";
  try {
    const results = await api(`/api/spotify/sync/${encodeURIComponent(target)}`, "POST");
    out.innerHTML = results.map(r =>
      `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a> : ${r.matched}/${r.total} titres trouvés` +
      (r.missing.length ? ` (introuvables : ${r.missing.map(esc).join(", ")})` : "")).join("<br>");
  } catch (e) {
    out.innerHTML = `<span class="error">Erreur : ${esc(e.message)}</span>`;
  }
}

document.getElementById("spotify").addEventListener("click", e => {
  if (e.target.dataset.sync) sync(e.target.dataset.sync);
});

const views = {
  async weekly(refresh) {
    const p = await api(`/api/playlists/weekly${refresh ? "?refresh=true" : ""}`);
    return playlistCard(p, "weekly");
  },
  async daily(refresh) {
    const ps = await api(`/api/playlists/daily${refresh ? "?refresh=true" : ""}`);
    return ps.map(p => playlistCard(p, "daily")).join("");
  },
  async moods(refresh, mood) {
    const moods = await api("/api/moods");
    const current = mood || moods[0].id;
    const p = await api(`/api/playlists/mood/${current}${refresh ? "?refresh=true" : ""}`);
    const picker = `<div class="actions">${moods.map(m =>
      `<button data-mood="${m.id}" style="${m.id === current ? "background:var(--accent);color:#fff" : ""}">${esc(m.name)}</button>`).join("")}</div>`;
    return picker + playlistCard(p, `moods:${current}`);
  },
  async history(refresh, playlist) {
    const all = await api("/api/history?limit=1000");
    const ids = [...new Map(all.map(e => [e.playlist_id, e.name.replace(/ ·.*$/, "")])).entries()];
    const entries = playlist ? all.filter(e => e.playlist_id === playlist) : all;
    const picker = `<div class="actions">
      <button data-history="" style="${!playlist ? "background:var(--accent);color:#fff" : ""}">Toutes</button>
      ${ids.map(([id, name]) => `<button data-history="${esc(id)}" style="${id === playlist ? "background:var(--accent);color:#fff" : ""}">${esc(id.startsWith("daily-") ? id.replace("daily-", "Daily Mix ") : name)}</button>`).join("")}
    </div>`;
    if (!entries.length) return picker + `<p class="loading">Aucune playlist générée pour l'instant.</p>`;
    const when = ts => new Date(ts * 1000).toLocaleString("fr-FR", { dateStyle: "full", timeStyle: "short" });
    return picker + `<p class="desc">Écoutes Last.fm de chaque titre depuis la création de la playlist.</p>` + entries.map(e => `
      <details class="card">
        <summary>
          <strong>${esc(e.name)}</strong>
          <span class="stats"><b>${e.listened_tracks}/${e.track_count}</b> titres écoutés<br>${e.plays} écoute${e.plays > 1 ? "s" : ""}</span>
          <span class="when">Créée le ${esc(when(e.created_at))}</span>
        </summary>
        <ol>${[...e.tracks].map(t => `
          <li>
            <span><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a> <span class="artist">· ${esc(t.artist)}</span></span>
            <span class="plays${t.plays ? " hit" : ""}">${t.plays} écoute${t.plays > 1 ? "s" : ""}</span>
          </li>`).join("")}</ol>
      </details>`).join("");
  },
  async profile(refresh) {
    const p = await api(`/api/profile${refresh ? "?refresh=true" : ""}`);
    return `<section class="card">
      <h2>${esc(p.user)}</h2>
      <p class="desc">${p.known_tracks} titres et ${p.known_artists} artistes connus.</p>
      <h3>Artistes du moment</h3><div class="tags">${p.top_artists.map(a => `<span>${esc(a)}</span>`).join("")}</div>
      <h3>Tags dominants</h3><div class="tags">${p.top_tags.map(a => `<span>${esc(a)}</span>`).join("")}</div>
      ${p.excluded_artists.length ? `<h3>Ignorés (podcasts…)</h3><p class="desc">${p.excluded_artists.map(esc).join(", ")}</p>` : ""}
      <div class="actions" style="margin-top:12px"><button data-refresh="profile">Recharger depuis Last.fm</button></div>
    </section>`;
  },
};

let shown = 0;
async function show(tab, refresh = false, mood = null) {
  const seq = ++shown;  // a slower, older request must not overwrite the tab opened since
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  content.innerHTML = `<p class="loading">${refresh ? "Génération" : "Chargement"} en cours… la première fois, l'analyse de Last.fm peut prendre une minute.</p>`;
  try {
    const html = await views[tab](refresh, mood);
    if (seq === shown) content.innerHTML = html;
  } catch (e) {
    if (seq === shown) content.innerHTML = `<p class="error">Erreur : ${esc(e.message)}</p>`;
  }
}

document.getElementById("tabs").addEventListener("click", e => {
  if (e.target.dataset.tab) show(e.target.dataset.tab);
});
content.addEventListener("click", e => {
  const { refresh, mood, sync: target, history } = e.target.dataset;
  if (target) sync(target);
  if (history !== undefined) show("history", false, history || null);
  if (mood) show("moods", false, mood);
  if (refresh) {
    const [tab, m] = refresh.split(":");
    show(tab, true, m || null);
  }
});
loadSpotify().finally(() => show("weekly"));
</script>
</body>
</html>
